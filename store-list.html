<style>
  :root {
    --surface-1:      #111a2e;
    --page:           #0a1120;
    --text-primary:   #f2f5fb;
    --text-secondary: #a9b3c9;
    --text-muted:     #7c869c;
    --gridline:       #23304a;
    --border:         rgba(255,255,255,0.08);
    --navy:           #0f1c36;
    --navy-2:         #1d3f6e;
    --accent:         #3987e5;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--page); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px 60px; }

  header.top {
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 100%);
    margin: 0 0 24px; padding: 22px 0 20px;
  }
  header.top .header-inner {
    max-width: 1400px; margin: 0 auto; padding: 0 24px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  header.top::after {
    content:""; display:block; height:4px; margin-top:18px;
    background: linear-gradient(90deg, #3987e5 0 25%, #d95926 25% 50%, #199e70 50% 75%, #c98500 75% 100%);
  }
  .brand { display:flex; flex-direction:column; gap:2px; }
  .brand .name { font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: #9fc2ea; }
  .brand h1 { margin:0; font-size:22px; font-weight:800; color:#ffffff; letter-spacing:-.01em; }
  .back-link { font-size:13px; font-weight:600; color:#eef4fb; background: rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22); border-radius:8px; padding:8px 14px; text-decoration:none; }
  .back-link:hover { background: rgba(255,255,255,0.2); }
  .toolbar { display:flex; gap:8px; }
  .dl-btn {
    font: inherit; font-size:13px; font-weight:600; color:#eef4fb; background: rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.22); border-radius:8px; padding:8px 14px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .dl-btn:hover { background: rgba(255,255,255,0.2); }

  .banner { background:#3a2e10; border:1px solid #5c4a1a; color:#f0d98c; border-radius:10px; padding:14px 16px; font-size:13.5px; margin-bottom:22px; line-height:1.6; }
  .banner strong { color:#ffe9a8; }

  .region-title { display:flex; align-items:center; gap:12px; margin-bottom:16px; padding:12px 18px; background: linear-gradient(90deg, var(--accent-color, var(--accent)) 0%, var(--navy) 130%); border-radius:10px; }
  .region-title h2 { margin:0; font-size:19px; font-weight:800; color:#fff; }
  .region-title .rt-sub { font-size:12.5px; color: rgba(255,255,255,0.85); }

  .table-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:10px; background: var(--surface-1); }
  table { width:100%; border-collapse: collapse; font-size:13px; white-space:nowrap; }
  th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--gridline); }
  th { background: rgba(255,255,255,0.04); color: var(--text-secondary); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .muted { color: var(--text-muted); font-size:12.5px; margin: -6px 0 16px; }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="header-inner">
      <div class="brand">
        <span class="name">Stortrack · Research &amp; Data</span>
        <h1>Store List</h1>
      </div>
      <div class="toolbar">
        <button class="dl-btn" id="downloadCsvBtn">⬇ Download CSV</button>
        <button class="dl-btn" id="downloadXlsxBtn">⬇ Download Excel (.xlsx)</button>
        <a class="back-link" href="index.html">← Back to Dashboard</a>
      </div>
    </div>
  </header>

  <div class="region-title" id="regionTitle" style="--accent-color:#3987e5">
    <div>
      <h2 id="regionName">Region</h2>
      <div class="rt-sub" id="regionSub">Full store list</div>
    </div>
  </div>
  <p class="muted" id="rowCount"></p>

  <div class="table-scroll">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

const params = new URLSearchParams(window.location.search);
const region = (params.get("region") || "canada").toLowerCase();
const name = params.get("name") || NAMES[region] || "Region";

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4PtXmZMAE6AIyRcy7QSfHfEFR9mNDuyaJlWDqvOYbNlk95jMu1PAcn8Jfyhp4CyK4/exec";
const LIVE_STORE_LIST_TABS = { "newzealand": "Store List", "australia": "Stores List", "canada": "Store List" };
const isLive = !!LIVE_STORE_LIST_TABS[region];
let rows = [];

document.getElementById("regionTitle").style.setProperty("--accent-color", ACCENTS[region] || "#3987e5");
document.getElementById("regionName").textContent = name;
document.getElementById("headRow").innerHTML = COLUMNS.map(c => `<th>${c[1]}</th>`).join("");

function renderTable() {
  document.getElementById("tableBody").innerHTML = rows.length ? rows.map(row => {
    const cells = COLUMNS.map(c => {
      const key = c[0];
      if (key === "Storename") return `<td><a href="${row.Url || '#'}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">${row.Storename || ""}</a></td>`;
      if (key === "Url") return "<td></td>";
      return `<td>${row[key] != null ? row[key] : ""}</td>`;
    }).join("");
    return "<tr>" + cells + "</tr>";
  }).join("") : (isLive ? `<tr><td colspan="${COLUMNS.length}" style="text-align:center;color:var(--text-muted);padding:24px;">No stores currently in the live Store List sheet for this region.</td></tr>` : "");
}

function updateStatusText() {
  if (isLive) {
    document.getElementById("regionSub").textContent = "Full store list — live sync";
    const storeWord = rows.length === 1 ? "store" : "stores";
    document.getElementById("rowCount").textContent = rows.length + " " + storeWord + " — live synced with the Store List sheet · last checked " + new Date().toLocaleTimeString();
  } else {
    document.getElementById("regionSub").textContent = "Full store list — sample preview, all columns";
    document.getElementById("rowCount").textContent = rows.length + " sample stores shown, " + COLUMNS.length + " columns (every store and column will show once the real Store List tab is connected)";
  }
}

async function fetchLiveRows() {
  const tabName = LIVE_STORE_LIST_TABS[region];
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?region=${region}&tab=${encodeURIComponent(tabName)}&_ts=${Date.now()}`, { cache: "no-store" });
    const j = await res.json();
    if (j.error || !j.grid || !j.grid.length) return [];
    const header = j.grid[0].map(h => String(h || "").trim());
    const dataRows = j.grid.slice(1).filter(r => r.some(v => String(v == null ? "" : v).trim() !== ""));
    return dataRows.map(r => {
      const obj = {};
      header.forEach((h, i) => { if (h) obj[h] = r[i]; });
      return obj;
    });
  } catch (err) { return []; }
}

async function loadAndRender() {
  if (isLive) {
    rows = await fetchLiveRows();
  } else {
    rows = SAMPLE_DATA[region] || [];
  }
  renderTable();
  updateStatusText();
}

loadAndRender();
if (isLive) setInterval(loadAndRender, 30000);

/* ------------------------------ Downloads (real CSV / real .xlsx) ------------------------------
   Exports whatever is currently loaded into `rows` above — sample data now, and your
   real store rows automatically once the live Store List tab is connected, since both
   the table and these exports read from the same `rows` + `COLUMNS` source. */
function fileSafeName(ext) {
  const stamp = new Date().toISOString().slice(0, 10);
  return `stortrack-${region}-store-list-${stamp}.${ext}`;
}
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function csvEscape(v) {
  const s = v == null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
document.getElementById("downloadCsvBtn").addEventListener("click", () => {
  const header = COLUMNS.map(c => csvEscape(c[1])).join(",");
  const lines = rows.map(row => COLUMNS.map(c => csvEscape(row[c[0]])).join(","));
  const csv = [header, ...lines].join("\r\n");
  triggerDownload(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" }), fileSafeName("csv"));
});
document.getElementById("downloadXlsxBtn").addEventListener("click", () => {
  const aoa = [COLUMNS.map(c => c[1]), ...rows.map(row => COLUMNS.map(c => row[c[0]] != null ? row[c[0]] : ""))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = COLUMNS.map(() => ({ wch: 16 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31) || "Store List");
  XLSX.writeFile(wb, fileSafeName("xlsx"));
});
